name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_model_smoke:
        description: Allow tiny model and registered SAELens download smokes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install development checks
        run: uv sync --only-group dev
      - name: Lint package and examples
        run: .venv/bin/ruff check prefscope examples
      - name: Check whitespace errors
        run: git diff --check

  build-and-smoke:
    # Proves the package builds and is usable WITHOUT torch: `pip install prefscope`
    # then `prefscope --help` must work (heavy imports are deferred into handlers).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Build wheel + sdist
        run: uv build
      - name: Clean-env install (core deps only, no torch)
        run: |
          uv venv /tmp/clean --python 3.12
          uv pip install --python /tmp/clean/bin/python dist/*.whl
      - name: import + torch-free CLI smoke
        run: |
          /tmp/clean/bin/python -c "import prefscope; print(prefscope.__name__)"
          /tmp/clean/bin/python -c "import importlib.util; assert importlib.util.find_spec('torch') is None, 'torch should NOT be installed'"
          /tmp/clean/bin/prefscope --help
          /tmp/clean/bin/prefscope-export-viewer --help
          /tmp/clean/bin/prefscope-viewer --help
          /tmp/clean/bin/prefscope init-demo --out /tmp/prefscope-demo
          /tmp/clean/bin/prefscope inspect --corpus /tmp/prefscope-demo/sample_corpus.parquet

  tests:
    # The package metadata promises Python >=3.10, so exercise every supported minor.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Sync project (CPU torch + tested cluster backend + dev deps)
        run: uv sync --python ${{ matrix.python-version }} --extra cpu --extra cluster --group dev
      - name: Run tests (skip slow/live)
        run: .venv/bin/python -m pytest -m "not slow" -q

  docs-contract:
    # Runs only local repository checks. Offline flags make accidental model access fail.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install core and test dependencies
        run: uv sync --group dev
      - name: Check Markdown links and CLI reference coverage
        run: .venv/bin/python -m pytest -q tests/test_docs_contract.py

  saelens-smoke:
    # Exercises the optional pretrained-SAE adapter against the real SAELens package.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install SAELens integration and test dependencies
        run: uv sync --python 3.12 --extra saelens --group dev
      - name: Run SAELens adapter contracts
        run: .venv/bin/python -m pytest -q tests/test_saelens_integration.py

  viewer-smoke:
    # Optional viewer imports and AppTest run without model downloads or live services.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install viewer extra and test dependencies
        run: uv sync --extra viewer --group dev
      - name: Run viewer integration smokes
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_viewer_app.py tests/test_optional_integrations.py -k viewer

  real-model-smoke:
    # Never runs on push/PR. Start it manually when Hugging Face downloads are desired.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_model_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install CPU model, SAELens, and test dependencies
        run: uv sync --extra cpu --extra saelens --group dev
      - name: Download a tiny model and train/reload a real lens
        env:
          PREFSCOPE_RUN_MODEL_SMOKE: "1"
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_optional_integrations.py -k tiny_real_model_lens_roundtrip
      - name: Download and project a registered pretrained SAE
        env:
          PREFSCOPE_RUN_SAELENS_SMOKE: "1"
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_saelens_integration.py -k registered_pretrained
