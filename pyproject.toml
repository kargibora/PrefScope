[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prefscope"
version = "0.2.0"
description = "PrefScope: an interpretability framework for diagnosing post-training data and model behavior with sparse autoencoders."
license = { text = "MIT" }
authors = [{ name = "Bora Kargı" }]
keywords = ["interpretability", "post-training", "preference-data", "sparse-autoencoder", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
requires-python = ">=3.10"
# Runtime deps are the ones the `prefscope` package actually imports. Heavy optional
# backends (embedding accelerators, viewer, clustering) live in extras below.
# scipy + pyyaml were imported but only available transitively — declared here now.
# sentence-transformers / matplotlib were declared but unused by the package (embedding
# goes through an OpenAI-compatible endpoint; plotting lives in the extras).
dependencies = [
    # Qwen3 embedding model support landed after the older 4.45 floor.
    "transformers>=4.51",
    "pandas>=2.0",
    "pyarrow>=15",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pyyaml>=6",
    "tqdm>=4.66",
    "openai>=1.40",
    # Direct dependency: Lens.from_pretrained uses snapshot_download.
    "huggingface-hub>=0.27",
]

[project.scripts]
prefscope = "prefscope.cli:console_main"
# Clear preferred name for the static JSON-bundle exporter.  Keep
# ``prefscope-viewer`` below for compatibility with existing workflows.
prefscope-export-viewer = "prefscope.viewer_export.cli:main"
prefscope-viewer = "prefscope.viewer_export.cli:main"
prefscope-view = "prefscope.viewer.launch:main"

[project.urls]
Homepage = "https://github.com/kargibora/PrefScope"
Repository = "https://github.com/kargibora/PrefScope"
Documentation = "https://github.com/kargibora/PrefScope/tree/main/docs"
Issues = "https://github.com/kargibora/PrefScope/issues"

[project.optional-dependencies]
# Optional visualization dependencies.
plots = ["matplotlib>=3.8"]
# Generic PyTorch extras. For a particular CUDA/ROCm build, install PyTorch from
# its official platform index first; package metadata cannot carry uv-only indexes.
cpu = ["torch>=2.3"]
torch = ["torch>=2.3"]
# Optional pretrained internal-activation SAE backend. Keep this out of the base
# install because SAELens brings TransformerLens and a full model-analysis stack.
saelens = ["sae-lens>=6.50,<7"]
viewer = [
    "streamlit>=1.36",
    "plotly>=5.22",
    "umap-learn>=0.5.7",
]
arena = [
    "datasets>=2.14",
]
# MI-graph + Leiden feature clustering (cluster_features method="mi-leiden").
cluster = [
    "igraph>=0.11",
    "leidenalg>=0.10",
]
# fast bulk embedding of large models (Linux + CUDA; install on the GPU box).
# NOTE: needs Python 3.10-3.12 — vLLM depends on ray, which has no 3.13 wheel.
#   uv python install 3.12 && uv venv --python 3.12 && uv sync --extra vllm
vllm = [
    "vllm>=0.6",
]

[tool.hatch.build.targets.wheel]
# Package only the importable library.
packages = ["prefscope"]

[tool.hatch.build.targets.sdist]
# Keep source distributions restricted to supported package and documentation files.
only-include = [
    "prefscope", "docs", "examples", "LICENSE", "README.md", "CONTRIBUTING.md",
    "CHANGELOG.md", "CODE_OF_CONDUCT.md", "SECURITY.md", "CITATION.cff",
    "THIRD_PARTY_NOTICES.md", "pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.14,<0.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: opt-in integration, heavy-model, live-API, or dedicated contract test",
    "integration: crosses package, optional-dependency, or repository-contract boundaries",
]
